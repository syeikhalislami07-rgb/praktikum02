<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form Pemesanan Pizza</title>
</head>

<body>
  <h1>Form pemesanan pizza</h1>
  <p>
    silakan isi form pemesanan ini dengan lengkap dan benar
  </p>

  <form action="#" method="post">
    <fieldset>
      <legend>informasi pemesanan</legend>
      <p>
        <label for="customername">Nama: </label>
        <input type="text" id="customername" name="customername" required>
      </p>
      <p>
        <label for="address">address: </label>
        <input type="text" id="address" name="address" required>
      </p>
      <p>
        <label for="telephone">telephone: </label>
        <input type="text" id="telephone" name="telephone" required>
      </p>
      <p>
        <label for="email">Email: </label>
        <input type="text" id="email" name="email" required>
      </p>
      <p>
        <label for="instruction">delevery instruction :</label><br>
        <textarea name="instruction" id="instruction" rows="4" cols="50" maxlength="400" placeholder="no more than 400 characters"></textarea>
      </p>
    </fieldset>

    <fieldset>
      <legend>desaign your dream pizza</legend>
      <p><strong>pizza specs</strong></p>
      <p>pilih salah satu</p>

      <p>
        <input type="radio" id="classic" name="crust" value="classic white" required>
        <label for="classic">classic white</label><br>

        <input type="radio" id="crust2" name="crust" value="classic white" required>
        <label for="crust2">classic white</label><br>

        <input type="radio" id="crust3" name="crust" value="classic white" required>
        <label for="crust3">classic white</label>
      </p>

      <p><strong>topping</strong></p>
      <p>
        <input type="checkbox" id="top_classic" name="toppings" value="classic">
        <label for="top_classic">classic white</label><br>

        <input type="checkbox" id="peperoni" name="toppings" value="peperoni">
        <label for="peperoni">peperoni</label><br>

        <input type="checkbox" id="ayam" name="toppings" value="ayam" required>
        <label for="ayam">ayam</label><br>

        <input type="checkbox" id="top_classic2" name="toppings" value="classic">
        <label for="top_classic2">classic white</label>
      </p>

      <p>
        <label for="quantity">quantity :</label>
        <select id="quantity" name="quantity" required>
          <option value="">--pilih jumlah--</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </p>
    </fieldset>

    <p>
      <input type="submit" value="Kirim">
    </p>
  </form>
</body>

</html>
